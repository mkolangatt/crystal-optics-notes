<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KTP Index Ellipsoid vs Theta</title>
<style>
  body{font-family:Arial,sans-serif;margin:24px;background:#fff;color:#111}
  .wrap{max-width:1000px;margin:auto}
  .controls{display:flex;gap:20px;align-items:center;margin-bottom:12px}
  input[type=range]{width:520px}
  canvas{width:100%;max-width:850px;border:1px solid #bbb;border-radius:10px}
  .info{margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<h2>KTP index ellipsoid and transverse section</h2>
<div class="controls">
<label>θ = <b id="tv">18°</b></label>
<input id="theta" type="range" min="0" max="90" step="1" value="18">
<span>φ = 0°</span>
</div>
<canvas id="c" width="850" height="620"></canvas>
<div class="info">
Kato–Takaoka at 1556 nm, 20 °C:
n<sub>x</sub>=1.728055, n<sub>y</sub>=1.734798, n<sub>z</sub>=1.815635.
&nbsp; n<sub>xz</sub>(θ)=<span id="nv"></span>.
</div>
</div>
<script>
const nx=1.728055381, ny=1.734797906, nz=1.815634979;
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const sl=document.getElementById("theta"),tv=document.getElementById("tv"),nv=document.getElementById("nv");
const W=cv.width,H=cv.height,cx=W*.5,cy=H*.53,S=135;
const elev=24*Math.PI/180, az=-48*Math.PI/180;
function cam(p){let[x,y,z]=p,ca=Math.cos(az),sa=Math.sin(az);
 let x1=ca*x-sa*y,y1=sa*x+ca*y,z1=z,ce=Math.cos(elev),se=Math.sin(elev);
 return [x1,ce*y1-se*z1,se*y1+ce*z1];}
function pr(p){let q=cam(p);return[cx+S*q[0],cy-S*q[2]]}
function line(ps,col,w=1,a=1){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=w;
 ctx.beginPath();ps.forEach((p,i)=>{let q=pr(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.stroke();ctx.restore()}
function poly(ps,col,a=.15){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.strokeStyle=col;ctx.beginPath();
 ps.forEach((p,i)=>{let q=pr(p);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
function arrow(a,b,col){let p=pr(a),q=pr(b);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2.5;
 ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...q);ctx.stroke();let A=Math.atan2(q[1]-p[1],q[0]-p[0]),L=10;
 ctx.beginPath();ctx.moveTo(...q);ctx.lineTo(q[0]-L*Math.cos(A-.45),q[1]-L*Math.sin(A-.45));
 ctx.lineTo(q[0]-L*Math.cos(A+.45),q[1]-L*Math.sin(A+.45));ctx.closePath();ctx.fill()}
function label(p,t,col="#111"){let q=pr(p);ctx.fillStyle=col;ctx.font="16px Arial";ctx.fillText(t,q[0]+5,q[1]-5)}
function draw(td){
 ctx.clearRect(0,0,W,H); let th=td*Math.PI/180,k=[Math.sin(th),0,Math.cos(th)];
 let e1=[0,1,0],e2=[Math.cos(th),0,-Math.sin(th)];
 let ne=1/Math.sqrt(Math.cos(th)**2/nx**2+Math.sin(th)**2/nz**2); nv.textContent=ne.toFixed(6);
 // ellipsoid wireframe
 for(let j=1;j<9;j++){let v=j*Math.PI/9,ps=[];for(let i=0;i<=120;i++){let u=i*2*Math.PI/120;
 ps.push([nx*Math.sin(v)*Math.cos(u),ny*Math.sin(v)*Math.sin(u),nz*Math.cos(v)])}line(ps,"#4c78a8",1,.4)}
 for(let j=0;j<12;j++){let u=j*2*Math.PI/12,ps=[];for(let i=0;i<=80;i++){let v=i*Math.PI/80;
 ps.push([nx*Math.sin(v)*Math.cos(u),ny*Math.sin(v)*Math.sin(u),nz*Math.cos(v)])}line(ps,"#4c78a8",1,.4)}
 // transverse plane
 let r=1.45,c=[];[[-r,-r],[r,-r],[r,r],[-r,r]].forEach(([a,b])=>c.push([a*e1[0]+b*e2[0],a*e1[1]+b*e2[1],a*e1[2]+b*e2[2]]));poly(c,"#f28e2b");
 // intersection ellipse
 let E=[];for(let i=0;i<=220;i++){let t=i*2*Math.PI/220;E.push([ny*Math.cos(t)*e1[0]+ne*Math.sin(t)*e2[0],
 ny*Math.cos(t)*e1[1]+ne*Math.sin(t)*e2[1],ny*Math.cos(t)*e1[2]+ne*Math.sin(t)*e2[2]])}line(E,"#2a9d66",3);
 let L=2.05;line([[-L,0,0],[L,0,0]],"#555");line([[0,-L,0],[0,L,0]],"#555");line([[0,0,-L],[0,0,L]],"#555");
 label([L,0,0],"x");label([0,L,0],"y");label([0,0,L],"z");
 arrow([0,0,0],[2.15*k[0],0,2.15*k[2]],"#7b5bb5");label([2.23*k[0],0,2.23*k[2]],"k","#7b5bb5");
 arrow([0,0,0],[0,ny,0],"#2a9d66");label([0,1.08*ny,0],"n_y","#2a9d66");
 arrow([0,0,0],[ne*e2[0],0,ne*e2[2]],"#2a9d66");label([1.07*ne*e2[0],0,1.07*ne*e2[2]],"n_xz(θ)","#2a9d66");
}
sl.oninput=()=>{tv.textContent=sl.value+"°";draw(+sl.value)};draw(+sl.value);
</script>
</body></html>
